name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests (no dependencies to install)
        run: npm test
      - name: Build packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SpriteSheetBuilder-packages
          path: dist/
          if-no-files-found: error
